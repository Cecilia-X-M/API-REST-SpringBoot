services:

  mysql:
    image: mysql:8.0
    container_name: api-rest-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: api_rest

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      timeout: 5s
      retries: 10
      interval: 5s

  api:
    build: .
    container_name: api-rest-spring

    ports:
      - "8081:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/api_rest
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: